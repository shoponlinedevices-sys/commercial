syntax = "proto3";

package email;

service EmailService {
  rpc SendEmail (SendEmailRequest)
      returns (SendEmailResponse);
  rpc SendOrderConfirmationEmail (SendOrderConfirmationEmailRequest)
      returns (SendEmailResponse);
  rpc SendPasswordResetEmail (SendPasswordResetEmailRequest)
      returns (SendEmailResponse);
  rpc GetEmailHistory (GetEmailHistoryRequest)
      returns (GetEmailHistoryResponse);
  rpc GetEmailsByRecipient (GetEmailsByRecipientRequest)
      returns (GetEmailHistoryResponse);
  rpc GetEmailById (GetEmailByIdRequest)
      returns (GetEmailByIdResponse);
}

message GetEmailHistoryRequest {
  int32 limit = 1;
}

message GetEmailsByRecipientRequest {
  string to = 1;
  int32 limit = 2;
}

message GetEmailByIdRequest {
  int32 id = 1;
}

message GetEmailHistoryResponse {
  repeated EmailRecord emails = 1;
}

message GetEmailByIdResponse {
  EmailRecord email = 1;
}

message EmailRecord {
  int32 id = 1;
  string to = 2;
  string subject = 3;
  string body = 4;
  string template = 5;
  map<string, string> templateData = 6;
  string status = 7;
  string messageId = 8;
  string error = 9;
  string createdAt = 10;
  string sentAt = 11;
}

message SendEmailRequest {
  string to = 1;
  string subject = 2;
  string body = 3;
  string template = 4;
  map<string, string> templateData = 5;
}

message SendOrderConfirmationEmailRequest {
  string to = 1;
  string orderId = 2;
  double totalAmount = 3;
  repeated OrderLine orderLines = 4;
  string shippingAddress = 5;
  string customerName = 6;
}

message OrderLine {
  string productId = 1;
  string productName = 2;
  int32 quantity = 3;
  double unitPrice = 4;
  double totalPrice = 5;
  string productImage = 6;
}

message SendPasswordResetEmailRequest {
  string to = 1;
  string username = 2;
  string temporaryPassword = 3;
}

message SendEmailResponse {
  bool success = 1;
  string messageId = 2;
  int32 emailId = 3;
  string error = 4;
}
