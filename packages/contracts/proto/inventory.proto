syntax = "proto3";

package inventory;

service InventoryService {
  rpc SaleStock (ProductSaleStock) returns (SaleInventory);
  rpc ReturnInventory (ProductSaleStock) returns (SaleInventory);
}

message Product {
  int32 id = 1;
  string name = 2;
  double price = 3;
  double oldPrice = 4;
  string description = 5;
  string image = 6;
  string badge = 7;
  string sku = 8;
  string unit = 9;
  string moq = 10;
  int32 quantityAvailable = 11;
}

message ProductSaleStock {
  int64 productId = 1;
  int32 quantity = 2;
  string referenceType = 3;
  string referenceId = 4;
  string note = 5;
  int64 createdBy = 6;
}

message ProductSaleStockResult {
  int64 id = 1;
  int64 productId = 2;
  int32 quantityOnHand = 3;
  int32 quantityReserved = 4;
  int32 reorderLevel = 5;
  string createdAt = 6;
  string updatedAt = 7;
  Product product = 8;
}

message InventoryTransaction {
  int64 id = 1;
  int64 productId = 2;
  string transactionType = 3;
  int32 quantity = 4;
  string referenceType = 5;
  string referenceId = 6;
  int32 quantityBefore = 7;
  int32 quantityAfter = 8;
  string note = 9;
  int64 createdBy = 10;
  string createdAt = 11;
  Product product = 12;
}

message SaleInventory {
  ProductSaleStockResult item = 1;
  InventoryTransaction transaction = 2;
}
