syntax = "proto3";

package product;

service ProductService {
  rpc GetHistoryLogs (GetHistoryLogsRequest) returns (GetHistoryLogsResponse);
  rpc GetProducts (GetProductsRequest) returns (GetProductsResponse);
  rpc GetFeaturedProducts (GetFeaturedProductsRequest) returns (GetProductsResponse);
  rpc GetProductsGroupedByCategory (GetProductsGroupedByCategoryRequest) returns (GetProductsGroupedByCategoryResponse);
  rpc GetProduct (GetProductRequest) returns (GetProductResponse);
  rpc CreateProduct (CreateProductRequest) returns (CreateProductResponse);
  rpc SaleStock (ProductSaleStock) returns (SaleInventory);
  rpc FindOne (GetProductRequest) returns (Product);
  rpc FindAll (FindProducts) returns (GetProductsResponse);
  rpc CreateSupplier (SupplierMutation) returns (SupplierRecord);
  rpc ListSuppliers (ListSuppliersRequest) returns (ListSuppliersResponse);
  rpc GetSupplier (GetSupplierRequest) returns (SupplierRecord);
  rpc UpdateSupplier (SupplierMutation) returns (SupplierRecord);
  rpc UpdateSupplierStatus (UpdateSupplierStatusRequest) returns (SupplierRecord);
  rpc CreateProductCost (ProductCostMutation) returns (ProductCostRecord);
  rpc ListProductCosts (ListProductCostsRequest) returns (ListProductCostsResponse);
  rpc GetProductCost (GetProductCostRequest) returns (ProductCostRecord);
  rpc UpdateProductCost (ProductCostMutation) returns (ProductCostRecord);
  rpc ListProductCostHistory (ListProductCostHistoryRequest) returns (ListProductCostsResponse);
  rpc GetLatestProductCost (GetLatestProductCostRequest) returns (GetLatestProductCostResponse);
  rpc GetProductCostSummary (Empty) returns (ProductCostSummary);
}

message Empty {}

message SupplierRecord {
  int32 id = 1;
  string name = 2;
  string phone = 3;
  string email = 4;
  string address = 5;
  string taxCode = 6;
  string note = 7;
  int32 status = 8;
  string createdAt = 9;
  string updatedAt = 10;
}

message SupplierMutation {
  int32 id = 1;
  string name = 2;
  string phone = 3;
  string email = 4;
  string address = 5;
  string taxCode = 6;
  string note = 7;
  bool hasName = 8;
  bool hasPhone = 9;
  bool hasEmail = 10;
  bool hasAddress = 11;
  bool hasTaxCode = 12;
  bool hasNote = 13;
}

message ListSuppliersRequest {
  string search = 1;
  int32 status = 2;
  bool hasStatus = 3;
  int32 page = 4;
  int32 limit = 5;
}

message ListSuppliersResponse {
  repeated SupplierRecord items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message GetSupplierRequest {
  int32 id = 1;
}

message UpdateSupplierStatusRequest {
  int32 id = 1;
  int32 status = 2;
}

message ProductCostRecord {
  string id = 1;
  int32 productId = 2;
  string productName = 3;
  string sku = 4;
  string salePrice = 5;
  int32 supplierId = 6;
  string supplierName = 7;
  string importPrice = 8;
  int32 quantity = 9;
  string shippingFee = 10;
  string otherFee = 11;
  string totalGoods = 12;
  string totalFees = 13;
  string totalValue = 14;
  string unitCost = 15;
  string expectedProfit = 16;
  string profitMarginPercent = 17;
  bool hasProfitMargin = 18;
  string importDate = 19;
  string note = 20;
  string createdAt = 21;
  bool hasSupplier = 22;
}

message ProductCostMutation {
  string id = 1;
  int32 productId = 2;
  int32 supplierId = 3;
  string importPrice = 4;
  int32 quantity = 5;
  string shippingFee = 6;
  string otherFee = 7;
  string importDate = 8;
  string note = 9;
  bool hasProductId = 10;
  bool hasSupplierId = 11;
  bool hasImportPrice = 12;
  bool hasQuantity = 13;
  bool hasShippingFee = 14;
  bool hasOtherFee = 15;
  bool hasImportDate = 16;
  bool hasNote = 17;
}

message ListProductCostsRequest {
  int32 productId = 1;
  int32 supplierId = 2;
  string search = 3;
  string from = 4;
  string to = 5;
  int32 page = 6;
  int32 limit = 7;
  bool hasProductId = 8;
  bool hasSupplierId = 9;
}

message ListProductCostHistoryRequest {
  int32 productId = 1;
  int32 page = 2;
  int32 limit = 3;
}

message GetProductCostRequest {
  string id = 1;
}

message GetLatestProductCostRequest {
  int32 productId = 1;
}

message GetLatestProductCostResponse {
  bool found = 1;
  ProductCostRecord item = 2;
}

message ListProductCostsResponse {
  repeated ProductCostRecord items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message ProductCostSummary {
  string totalImports = 1;
  string totalValue = 2;
  string productsWithCost = 3;
}

message FindProducts {
  int32 categoryId = 1;
}

message GetProductsRequest {
  // Optional filters
  string category = 1;
  string search = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message GetProductsResponse {
  repeated Product products = 1;
  int32 total = 2;
}

message GetFeaturedProductsRequest {}

message GetProductsGroupedByCategoryRequest {
  string search = 1;
  int32 categoryId = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ProductsGroupedByCategory {
  string name = 1;
  string slug = 2;
  int32 isActive = 3;
  string icon = 4;
  repeated Product products = 5;
  int32 id = 6;
}

message GetProductsGroupedByCategoryResponse {
  repeated ProductsGroupedByCategory categories = 1;
}

message GetProductRequest {
  int32 id = 1;
}

message GetProductResponse {
  Product product = 1;
}

message CreateProductRequest {
  string name = 1;
  double price = 2;
  string description = 3;
  string image = 4;
  double oldPrice = 5;
  string badge = 6;
  string sku = 7;
  string unit = 8;
  string moq = 9;
  string category = 10;
  string createdBy = 11;
}

message CreateProductResponse {
  Product product = 1;
}

message Product {
  int32 id = 1;
  string name = 2;
  double price = 3;
  double oldPrice = 4;
  string description = 5;
  string image = 6;
  string badge = 7;
  string sku = 8;
  string unit = 9;
  string moq = 10;
  int32 quantityAvailable = 11;
}

message ProductSaleStock {
  int64 productId = 1;
  int32 quantity = 2;
  string referenceType = 3;
  string referenceId = 4;
  string note = 5;
  int64 createdBy = 6;
}

message ProductSaleStockResult {
  int64 id = 1;
  int64 productId = 2;
  int32 quantityOnHand = 3;
  int32 quantityReserved = 4;
  int32 reorderLevel = 5;
  string createdAt = 6;
  string updatedAt = 7;
  Product product = 8;
}

message InventoryTransaction {
  int64 id = 1;
  int64 productId = 2;
  string transactionType = 3;
  int32 quantity = 4;
  string referenceType = 5;
  string referenceId = 6;
  int32 quantityBefore = 7;
  int32 quantityAfter = 8;
  string note = 9;
  int64 createdBy = 10;
  string createdAt = 11;
  Product product = 12;
}

message SaleInventory {
  ProductSaleStockResult item = 1;
  InventoryTransaction transaction = 2;
}

message GetHistoryLogsRequest {
  int32 limit = 1;
}

message HistoryLog {
  string id = 1;
  string action = 2;
  string entityType = 3;
  string entityId = 4;
  string source = 5;
  string createdBy = 6;
  string metadata = 7;
  string createdAt = 8;
}

message GetHistoryLogsResponse {
  repeated HistoryLog logs = 1;
}
