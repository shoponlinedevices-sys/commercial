syntax = "proto3";

package orders;

service OrdersService {
  // Orders
  rpc GetUserOrders (GetUserOrdersRequest) returns (GetUserOrdersResponse);
  rpc GetOrder (GetOrderRequest) returns (GetOrderResponse);
  rpc CreateOrder (CreateOrderRequest) returns (CreateOrderResponse);
  rpc UpdateOrderStatus (UpdateOrderStatusRequest) returns (UpdateOrderStatusResponse);
  
  // Cart
  rpc GetCart (GetCartRequest) returns (GetCartResponse);
  rpc GetCartByUserId (GetCartByUserIdRequest) returns (GetCartByUserIdResponse);
  rpc AddToCart (AddToCartRequest) returns (AddToCartResponse);
  rpc GetCartLinesByUserId (GetCartLinesByUserIdRequest) returns (GetCartLinesByUserIdResponse);
  rpc RemoveCartLine (RemoveCartLineRequest) returns (RemoveCartLineResponse);
  rpc ClearCartByUserId (ClearCartByUserIdRequest) returns (ClearCartByUserIdResponse);
}

// Order Messages
message GetUserOrdersRequest {
  string userId = 1;
}

message GetUserOrdersResponse {
  repeated Order orders = 1;
}

message GetOrderRequest {
  string id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message CreateOrderRequest {
  string userId = 1;
  double totalAmount = 2;
  repeated OrderLine orderLines = 3;
  string shippingAddress = 4;
  string fcmToken = 5;
}

message CreateOrderResponse {
  Order order = 1;
}

message UpdateOrderStatusRequest {
  string id = 1;
  string status = 2;
}

message UpdateOrderStatusResponse {
  Order order = 1;
}

message Order {
  string id = 1;
  string userId = 2;
  double totalAmount = 3;
  string status = 4;
  repeated OrderLine orderLines = 5;
  string shippingAddress = 6;
  string fcmToken = 7;
  string createdAt = 8;
  string updatedAt = 9;
}

message OrderLine {
  string id = 1;
  string orderId = 2;
  string productId = 3;
  string unitPrice = 4;
  int32 quantity = 5;
  string totalPrice = 6;
  string createdAt = 7;
  string updatedAt = 8;
}

// Cart Messages
message GetCartRequest {
  int32 id = 1;
}

message GetCartResponse {
  Cart cart = 1;
}

message GetCartByUserIdRequest {
  int32 userId = 1;
}

message GetCartByUserIdResponse {
  Cart cart = 1;
}

message AddToCartRequest {
  int32 userId = 1;
  int32 productId = 2;
  int32 quantity = 3;
  repeated CartLine cartLines = 4;
}

message AddToCartResponse {
  Cart cart = 1;
}

message GetCartLinesByUserIdRequest {
  int32 userId = 1;
}

message GetCartLinesByUserIdResponse {
  repeated CartLine cartLines = 1;
}

message RemoveCartLineRequest {
  int32 cartLineId = 1;
}

message RemoveCartLineResponse {
  bool success = 1;
}

message ClearCartByUserIdRequest {
  int32 userId = 1;
}

message ClearCartByUserIdResponse {
  bool success = 1;
}

message Cart {
  int32 id = 1;
  int32 userId = 2;
  string totalPrice = 3;
  int32 status = 4;
  string createdAt = 5;
  string updatedAt = 6;
  repeated CartLine cartLines = 7;
}

message CartLine {
  int32 id = 1;
  int32 cartId = 2;
  int32 productId = 3;
  int32 quantity = 4;
  double unitPrice = 5;
  int32 status = 6;
}
